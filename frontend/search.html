<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent Search - RC3 Job Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        #search-form .d-field
        {
            flex: 1 1 320px;
        }

        #search-form input
        {
            width: 100%;
        }

        #examples
        {
            align-items: center;
        }

        button.d-chip
        {
            font-family: inherit;
            border: none;
            cursor: pointer;
        }

        button.d-chip:hover
        {
            background: #dfe3ef;
        }

        .s-result
        {
            border: 1px solid #e6e8f0;
            border-radius: 14px;
            background: #fff;
            padding: 18px 20px;
            margin-bottom: 14px;
            transition: border-color 0.15s;
        }

        .s-result:last-child
        {
            margin-bottom: 0;
        }

        .s-result:hover
        {
            border-color: var(--ac);
        }

        .s-result-head
        {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .s-result-head .main
        {
            flex: 1;
            min-width: 0;
        }

        .s-result-head .main b
        {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .s-result-head .main span
        {
            font-size: 0.82rem;
            color: #64748b;
        }

        .s-result .d-excerpt
        {
            margin-bottom: 8px;
        }

        .s-result .d-excerpt:last-of-type
        {
            margin-bottom: 0;
        }

        .s-result-foot
        {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
        }

        @media (max-width: 480px)
        {
            #search-btn
            {
                width: 100%;
            }
        }
    </style>
</head>
<body class="theme-recruiter">
    <div id="content" class="d-content">
        <section class="d-panel" aria-label="Talent search">
            <form id="search-form" class="d-toolbar" novalidate>
                <div class="d-field">
                    <label for="query">Describe the talent you need</label>
                    <input type="text" id="query" placeholder="e.g. Python Django REST APIs" autocomplete="off" aria-describedby="query-error">
                </div>
                <button class="btn" id="search-btn" type="submit"><i data-lucide="search"></i>Search</button>
            </form>
            <div id="query-error" class="error-text hidden" role="alert"></div>
            <div class="d-chips" id="examples">
                <span class="muted">Try</span>
                <button class="d-chip" type="button" data-query="Python Django">Python Django</button>
                <button class="d-chip" type="button" data-query="React TypeScript">React TypeScript</button>
                <button class="d-chip" type="button" data-query="SQL Excel">SQL Excel</button>
            </div>
        </section>

        <div class="d-callout">
            <i data-lucide="sparkles"></i>
            <div>
                <b>How semantic search works</b>
                Matches are ranked by the evidence found in resume text, not just profile keywords, and a human reviews every match before a hiring decision.
            </div>
        </div>

        <section class="d-panel" aria-label="Search results">
            <div class="d-panel-head">
                <div>
                    <h3>Results</h3>
                    <p class="sub" id="result-count">Only applications that have been assessed appear here</p>
                </div>
            </div>
            <div id="results"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <script src="js/mock.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        const user = guardPage('recruiter');

        function showQueryError(message)
        {
            const box = document.getElementById('query-error');
            box.textContent = message || '';
            box.classList.toggle('hidden', !message);
        }

        function showInitialResults()
        {
            document.getElementById('result-count').textContent = 'Only applications that have been assessed appear here';
            document.getElementById('results').innerHTML = Dash.empty('search', 'Describe the talent you need and search across every assessed application.');
        }

        function highlight(excerpt, term)
        {
            const safeText = Dash.esc(excerpt);
            const safeTerm = Dash.esc(term);

            if (!safeTerm)
            {
                return safeText;
            }

            const pattern = new RegExp(safeTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');

            return safeText.replace(pattern, function (match)
            {
                return '<mark>' + match + '</mark>';
            });
        }

        function resultCard(item)
        {
            const score = Number(item.score) || 0;
            const match = Math.round((Number(item.similarity) || 0) * 100);
            const href = 'applicant-detail.html?id=' + encodeURIComponent(item.applicationId) + '&jobId=' + encodeURIComponent(item.jobId);

            return '<article class="s-result">' +
                '<div class="s-result-head">' +
                    '<div class="main"><b>' + Dash.esc(item.candidateName) + '</b><span>Applied to ' + Dash.esc(item.jobTitle) + '</span></div>' +
                    '<span class="d-chip info">' + match + '% match</span>' +
                    Dash.badge('Score ' + score, Dash.scoreTone(score)) +
                    Dash.badge(item.status, Dash.statusTone(item.status)) +
                '</div>' +
                (item.excerpts || []).map(function (excerpt)
                {
                    return '<div class="d-excerpt"><b>' + Dash.esc(excerpt.skill) + '</b> — ' + highlight(excerpt.excerpt, excerpt.term) + '</div>';
                }).join('') +
                '<div class="s-result-foot"><a class="btn btn-secondary btn-sm" href="' + href + '">View applicant<i data-lucide="arrow-right"></i></a></div>' +
            '</article>';
        }

        function renderResults(data)
        {
            const results = data.results || [];
            const countLine = document.getElementById('result-count');

            if (!results.length)
            {
                countLine.textContent = 'No candidates match';
                document.getElementById('results').innerHTML = Dash.empty('search', 'No assessed applications match "' + (data.query || '') + '". Try different wording, fewer terms or a broader skill name.');
                return;
            }

            countLine.textContent = results.length + (results.length === 1 ? ' candidate matches' : ' candidates match');
            document.getElementById('results').innerHTML = results.map(function (item) { return resultCard(item); }).join('');
        }

        async function runSearch()
        {
            const input = document.getElementById('query');
            const button = document.getElementById('search-btn');
            const results = document.getElementById('results');
            const query = input.value.trim();

            showQueryError('');

            if (query.length < 2)
            {
                showQueryError('Please describe the talent you are looking for in at least 2 characters.');
                input.focus();
                return;
            }

            Dash.setBusy(button, true);
            document.getElementById('result-count').textContent = 'Searching...';
            results.innerHTML = Dash.skeletons(3);

            try
            {
                const data = await Api.post('/api/talent/search', { query: query });
                renderResults(data);
                showToast(data.count + (data.count === 1 ? ' candidate found.' : ' candidates found.'), 'success');
            }
            catch (error)
            {
                if (error.status === 400)
                {
                    showQueryError(error.message);
                    showInitialResults();
                }
                else
                {
                    document.getElementById('result-count').textContent = 'Search failed';
                    Dash.failInto(results, error.message, runSearch);
                }
            }

            Dash.setBusy(button, false);
            Dash.icons();
        }

        function load()
        {
            showInitialResults();
            Dash.icons();
        }

        if (user)
        {
            document.getElementById('search-form').addEventListener('submit', function (event)
            {
                event.preventDefault();
                runSearch();
            });

            document.getElementById('examples').addEventListener('click', function (event)
            {
                const chip = event.target.closest('[data-query]');

                if (!chip)
                {
                    return;
                }

                document.getElementById('query').value = chip.getAttribute('data-query');
                runSearch();
            });

            Dash.mountShell(
            {
                user: user,
                logo: 'search',
                title: 'Talent Search',
                subtitle: 'Find candidates by the evidence in their resumes',
                search: true,
                items: Dash.RECRUITER_NAV,
                onBell: function ()
                {
                    showToast('You have no new notifications.', 'info');
                }
            });

            load();
        }
    </script>
</body>
</html>
