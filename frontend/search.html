<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent search – SORYNTH</title>
    <meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F1623" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body class="theme-recruiter">
    <script src="js/brand.js"></script>
    <script>showPageLoader(); window.addEventListener('load', hidePageLoader);</script>
    <div id="content" class="d-content">
        <section class="d-panel" aria-label="Talent search">
            <form id="search-form" class="pg-query" novalidate>
                <div class="d-field">
                    <label for="query">Describe the talent you need</label>
                    <input type="text" id="query" placeholder="e.g. Python Django REST APIs" autocomplete="off" aria-describedby="query-error query-note">
                </div>
                <button class="btn" id="search-btn" type="submit"><i data-lucide="search"></i>Search talent</button>
            </form>
            <div id="query-error" class="error-text hidden" role="alert"></div>
            <div class="pg-try" id="examples">
                <span class="muted">Try</span>
                <button type="button" data-query="Python Django">Python Django</button>
                <button type="button" data-query="React TypeScript">React TypeScript</button>
                <button type="button" data-query="SQL Excel">SQL Excel</button>
            </div>
            <p class="pg-note" id="query-note">Results are ranked by meaning, not exact keywords. AI assessment. You make the final decision.</p>
        </section>

        <section class="d-panel" aria-label="Search results">
            <div class="d-panel-head">
                <div>
                    <h3>Results</h3>
                    <p class="sub" id="result-count" aria-live="polite">Only applications that have been assessed appear here</p>
                </div>
            </div>
            <div id="results"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/illustrations.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/mock.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        const user = guardPage('recruiter');

        function showQueryError(message)
        {
            const box = document.getElementById('query-error');
            box.textContent = message || '';
            box.classList.toggle('hidden', !message);
        }

        function showInitialResults()
        {
            document.getElementById('result-count').textContent = 'Only applications that have been assessed appear here';
            document.getElementById('results').innerHTML = Dash.empty('search', 'Describe the talent you need, or pick an example above, and search across every assessed application.');
        }

        function termsFor(excerpt, query)
        {
            const terms = [];

            if (excerpt.term)
            {
                terms.push(excerpt.term);
            }

            String(query || '').split(/\s+/).forEach(function (word)
            {
                if (word.length > 1)
                {
                    terms.push(word);
                }
            });

            return terms;
        }

        function highlight(text, terms)
        {
            const raw = String(text || '');

            const parts = terms.map(function (term)
            {
                return String(term).trim();
            })
            .filter(Boolean)
            .sort(function (a, b)
            {
                return b.length - a.length;
            })
            .map(function (term)
            {
                return term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            });

            if (!parts.length)
            {
                return Dash.esc(raw);
            }

            const pattern = new RegExp(parts.join('|'), 'gi');
            let out = '';
            let last = 0;
            let found = pattern.exec(raw);

            while (found !== null)
            {
                if (found[0] === '')
                {
                    pattern.lastIndex++;
                }
                else
                {
                    out += Dash.esc(raw.slice(last, found.index)) + '<mark>' + Dash.esc(found[0]) + '</mark>';
                    last = found.index + found[0].length;
                }

                found = pattern.exec(raw);
            }

            return out + Dash.esc(raw.slice(last));
        }

        function resultCard(item, index, query)
        {
            const score = Number(item.score) || 0;
            const similarity = Math.max(0, Math.min(1, Number(item.similarity) || 0));
            const match = Math.round(similarity * 100);
            const href = 'applicant-detail.html?id=' + encodeURIComponent(item.applicationId) + '&jobId=' + encodeURIComponent(item.jobId);

            return '<article class="s-result" style="--i:' + index + '">' +
                '<div class="s-head">' +
                    '<div class="main"><b>' + Dash.esc(item.candidateName) + '</b><span>Applied to ' + Dash.esc(item.jobTitle) + '</span></div>' +
                    '<div class="s-sim" role="img" aria-label="' + match + ' percent match"><span class="s-bar"><i style="--w:' + similarity + '"></i></span>' + match + '%</div>' +
                    Dash.badge('Score ' + score, Dash.scoreTone(score)) +
                    Dash.badge(item.status, Dash.statusTone(item.status)) +
                '</div>' +
                (item.excerpts || []).map(function (excerpt)
                {
                    return '<p class="s-excerpt"><b>' + Dash.esc(excerpt.skill) + '</b>' + highlight(excerpt.excerpt, termsFor(excerpt, query)) + '</p>';
                }).join('') +
                '<div class="s-foot"><a class="btn btn-secondary btn-sm" href="' + href + '">View applicant</a></div>' +
            '</article>';
        }

        function renderResults(data, query)
        {
            const results = data.results || [];
            const countLine = document.getElementById('result-count');

            if (!results.length)
            {
                countLine.textContent = 'No candidates match';
                document.getElementById('results').innerHTML = Dash.empty('search', 'No assessed applications match "' + (data.query || query) + '". Try different wording, fewer terms or a broader skill name.');
                return;
            }

            countLine.textContent = results.length + (results.length === 1 ? ' candidate matches' : ' candidates match');
            document.getElementById('results').innerHTML = results.map(function (item, index)
            {
                return resultCard(item, index, query);
            }).join('');
        }

        async function runSearch()
        {
            const input = document.getElementById('query');
            const button = document.getElementById('search-btn');
            const results = document.getElementById('results');
            const query = input.value.trim();

            showQueryError('');

            if (query.length < 2)
            {
                showQueryError('Please describe the talent you are looking for in at least 2 characters.');
                input.focus();
                return;
            }

            Dash.setBusy(button, true);
            document.getElementById('result-count').textContent = 'Searching';
            results.innerHTML = Dash.skeletons(3);

            try
            {
                const data = await Api.post('/api/talent/search', { query: query });
                const count = data.count !== undefined ? data.count : (data.results || []).length;

                renderResults(data, query);
                showToast(count + (count === 1 ? ' candidate found.' : ' candidates found.'), 'success');

                if (window.history && history.replaceState)
                {
                    history.replaceState(null, '', '?q=' + encodeURIComponent(query) + (Dash.param('mock') ? '&mock=1' : ''));
                }
            }
            catch (error)
            {
                if (error.status === 400)
                {
                    showQueryError(error.message);
                    showInitialResults();
                }
                else
                {
                    document.getElementById('result-count').textContent = 'Search failed';
                    Dash.failInto(results, error.message, runSearch);
                }
            }

            Dash.setBusy(button, false);
            Dash.icons();
        }

        function load()
        {
            const preset = Dash.param('q');

            showInitialResults();
            Dash.icons();

            if (preset)
            {
                document.getElementById('query').value = preset;
                runSearch();
            }
        }

        if (user)
        {
            document.getElementById('search-form').addEventListener('submit', function (event)
            {
                event.preventDefault();
                runSearch();
            });

            document.getElementById('examples').addEventListener('click', function (event)
            {
                const chip = event.target.closest('[data-query]');

                if (!chip)
                {
                    return;
                }

                document.getElementById('query').value = chip.getAttribute('data-query');
                runSearch();
            });

            Dash.mountShell(
            {
                user: user,
                logo: 'search',
                title: 'Talent Search',
                subtitle: 'Find candidates by the evidence in their resumes',
                search: true,
                items: Dash.RECRUITER_NAV,
                onBell: function ()
                {
                    showToast('You have no new notifications.', 'info');
                }
            });

            load();
        }
    </script>
</body>
</html>
