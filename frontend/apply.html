<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply - RC3 Job Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .drop{border:2px dashed #cdd2e3;border-radius:14px;padding:26px;text-align:center;background:#fafaff}
        .drop.has{border-color:var(--ac);background:var(--soft)}
        .bar{height:8px;border-radius:9px;background:#eceef6;overflow:hidden;margin-top:14px}
        .bar u{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2));animation:slide 1.1s infinite ease-in-out}
        @keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
    </style>
</head>
<body class="theme-candidate">
    <div id="content" class="d-content">
        <section class="d-panel" aria-label="Apply for a job">
            <h3 id="job-title">Loading job...</h3>
            <p class="sub" id="job-meta"></p>
            <div id="form-error" class="form-error hidden" role="alert"></div>
            <form id="apply-form" novalidate class="hidden">
                <div class="drop" id="drop">
                    <p><b id="file-name">Choose your resume</b></p>
                    <p class="muted" id="file-hint">PDF only, up to 5 MB</p>
                    <input type="file" id="resume" accept="application/pdf,.pdf" aria-label="Resume PDF" style="margin-top:12px">
                </div>
                <div class="error-text" id="resume-error"></div>
                <div class="bar hidden" id="progress" role="progressbar" aria-label="Uploading resume"><u></u></div>
                <div class="row" style="margin-top:16px">
                    <button type="submit" class="btn" id="submit-btn">Submit application</button>
                    <a class="btn btn-secondary" href="candidate.html#jobs">Cancel</a>
                </div>
            </form>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <script src="js/mock.js"></script>
    <script src="js/mock-candidate.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        const user = guardPage('candidate');
        const jobId = new URLSearchParams(window.location.search).get('jobId');
        const MAX_BYTES = 5 * 1024 * 1024;

        function el(id)
        {
            return document.getElementById(id);
        }

        function showError(message)
        {
            el('form-error').textContent = message;
            el('form-error').classList.toggle('hidden', !message);
        }

        function fileProblem(file)
        {
            if (!file)
            {
                return 'Please choose your resume PDF.';
            }

            if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name))
            {
                return 'Only PDF files are accepted. Please export your resume as a PDF.';
            }

            if (file.size > MAX_BYTES)
            {
                return 'This file is larger than 5 MB. Please upload a smaller PDF.';
            }

            return '';
        }

        function onFileChange()
        {
            const file = el('resume').files[0];
            const problem = file ? fileProblem(file) : '';
            el('resume-error').textContent = problem;
            el('drop').classList.toggle('has', Boolean(file) && !problem);
            el('file-name').textContent = file ? file.name : 'Choose your resume';
            el('file-hint').textContent = file ? (file.size / 1024 / 1024).toFixed(2) + ' MB' : 'PDF only, up to 5 MB';
        }

        async function loadJob()
        {
            if (!jobId)
            {
                el('job-title').textContent = 'No job selected';
                showError('Open a job from your dashboard and choose Apply now.');
                return;
            }

            try
            {
                const job = await Api.get('/api/jobs/' + encodeURIComponent(jobId));
                el('job-title').textContent = job.title;
                el('job-meta').textContent = [job.department, job.location, job.type].filter(Boolean).join(', ');

                if (job.status !== 'open')
                {
                    showError('This job is closed and no longer accepts applications.');
                    return;
                }

                el('apply-form').classList.remove('hidden');
            }
            catch (error)
            {
                el('job-title').textContent = 'Job unavailable';
                showError(error.message);
            }
        }

        async function submit(event)
        {
            event.preventDefault();
            showError('');
            const file = el('resume').files[0];
            const problem = fileProblem(file);
            el('resume-error').textContent = problem;

            if (problem)
            {
                return;
            }

            const data = new FormData();
            data.append('jobId', jobId);
            data.append('resume', file);

            el('submit-btn').disabled = true;
            el('submit-btn').classList.add('loading');
            el('progress').classList.remove('hidden');

            try
            {
                await Api.upload('/api/applications', data);
                showToast('Application submitted. Good luck!', 'success');
                setTimeout(function ()
                {
                    window.location.href = 'my-applications.html';
                }, 800);
            }
            catch (error)
            {
                showError(error.message);
                el('submit-btn').disabled = false;
                el('submit-btn').classList.remove('loading');
                el('progress').classList.add('hidden');
            }
        }

        if (user)
        {
            Dash.mountShell(
            {
                user: user,
                logo: 'rocket',
                title: 'Apply',
                subtitle: 'Upload your resume',
                search: false,
                items:
                [
                    { label: 'Overview', href: 'candidate.html', icon: 'layout-dashboard' },
                    { label: 'Browse Jobs', href: 'candidate.html#jobs', icon: 'search' },
                    { label: 'My Applications', href: 'my-applications.html', icon: 'file-text' },
                    { label: 'My Profile', href: 'profile.html', icon: 'user' },
                    { label: 'Notifications', href: 'candidate.html#notifications', icon: 'bell' }
                ],
                onBell: function ()
                {
                    window.location.href = 'candidate.html#notifications';
                }
            });

            document.querySelectorAll('.d-nav a').forEach(function (link)
            {
                link.classList.toggle('on', link.getAttribute('href') === 'candidate.html#jobs');
            });

            el('resume').addEventListener('change', onFileChange);
            el('apply-form').addEventListener('submit', submit);
            loadJob();
        }
    </script>
</body>
</html>
