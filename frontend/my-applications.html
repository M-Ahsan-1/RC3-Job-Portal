<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My applications – SORYNTH</title>
    <meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F1623" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/candidate.css">
</head>
<body class="theme-candidate">
    <script src="js/brand.js"></script>
    <script>showPageLoader(); window.addEventListener('load', hidePageLoader);</script>
    <div id="content" class="d-content">
        <section class="d-panel" aria-label="My applications">
            <h3>My applications</h3>
            <p class="sub">Follow every application from submission to decision</p>
            <div id="apps-list"></div>
        </section>

        <section class="d-panel" id="notifications" tabindex="-1" aria-label="Notifications">
            <div class="d-panel-head">
                <div>
                    <h3>Notifications</h3>
                    <p class="sub">Updates about your applications</p>
                </div>
                <button class="btn btn-secondary btn-sm" id="mark-read" type="button">Mark all as read</button>
            </div>
            <div id="notes-list"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/illustrations.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/mock.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/candidate-shared.js"></script>
    <script>
        const user = guardPage('candidate');
        const appsList = document.getElementById('apps-list');
        let notes = null;

        function renderApps(apps)
        {
            if (!apps.length)
            {
                appsList.innerHTML = Dash.empty('file-text', 'You have not applied to any jobs yet. When you apply, every update appears here.', '<a class="btn btn-sm" href="candidate.html#jobs">Browse open jobs</a>');
                return;
            }

            appsList.innerHTML = apps.map(function (app)
            {
                return CandidateKit.applicationHtml(app, false);
            }).join('');
        }

        async function load()
        {
            appsList.innerHTML = Dash.skeletons(2);

            try
            {
                renderApps(await Api.get('/api/candidate/applications'));
            }
            catch (error)
            {
                Dash.failInto(appsList, error.message, load);
            }

            Dash.icons();
        }

        if (user)
        {
            Dash.mountShell(
            {
                user: user,
                logo: 'rocket',
                title: 'My applications',
                subtitle: 'Every step of your journey in one place',
                search: false,
                active: 'my-applications.html',
                items: Dash.CANDIDATE_NAV,
                onBell: CandidateKit.bellHandler
            });

            notes = CandidateKit.mountNotes({ list: document.getElementById('notes-list'), markButton: document.getElementById('mark-read') });

            load();
            notes.load();
        }
    </script>
</body>
</html>
